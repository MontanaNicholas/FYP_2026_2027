
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OH, RATS! Marker Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .camera-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        video, canvas {
            width: 48%;
            max-width: 640px;
            background: #ddd;
            border: 2px solid #333;
        }

        #status {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>OH, RATS! Marker Detection Test</h1>
    <p>Testing phone camera and QR marker detection.</p>

    <div class="camera-container">
        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <p id="status">Finding DroidCam...</p>

    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

    <script>
        // Find the HTML elements
        const camera = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");
        const status = document.getElementById("status");

        // Find and start DroidCam
        async function startCamera() {
            try {
                status.textContent = "Looking for DroidCam...";

                // Find available cameras
                const devices = await navigator.mediaDevices.enumerateDevices();

                const droidCam = devices.find(function (device) {
                    return device.kind === "videoinput" &&
                           device.label.includes("DroidCam");
                });

                if (!droidCam) {
                    throw new Error("DroidCam not found. Check that DroidCam is running.");
                }

                status.textContent = "Connecting to DroidCam...";

                // Start the selected camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: { exact: droidCam.deviceId }
                    }
                });

                camera.srcObject = stream;

                await camera.play();
                console.log("Video dimensions:", camera.videoWidth, camera.videoHeight);

                status.textContent = "DroidCam connected! Looking for a QR marker...";

            } catch (error) {
                console.error("Camera error:", error);
                status.textContent = "Camera error: " + error.name + " - " + error.message;
            }
        }

        // Check the camera image for a QR code
        function detectMarker() {
            if (camera.readyState === camera.HAVE_ENOUGH_DATA) {

                // Copy the webcam image onto the canvas
                context.drawImage(
                    camera,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // Read the image pixels
                const imageData = context.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // Try to detect a QR code
                const code = jsQR(
                    imageData.data,
                    imageData.width,
                    imageData.height
                );

                // Display the result
                if (code) {
                    status.textContent = "Marker detected: " + code.data;
                } else {
                    status.textContent = "DroidCam connected! Looking for a QR marker...";
                }
            }

            // Check the next camera frame
            requestAnimationFrame(detectMarker);
        }

        // Start detection when the camera begins playing
        camera.addEventListener("playing", function () {
            detectMarker();
        });

        // Start everything
        startCamera();

    </script>

</body>
</html>
